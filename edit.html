<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Редагування групи</title>
  <style>
    body { font-family: sans-serif; padding: 15px; background: #f4f4f4; }
    h3 { margin-top: 0; color: #00796b; }
    table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    th, td { padding: 8px; border: 1px solid #ddd; text-align: left; }
    th { background: #e0f2f1; color: #004d40; }
    input[type="text"] { width: 100%; padding: 5px; box-sizing: border-box; border: 1px solid #ccc; }
    input[readonly] { background: #eee; cursor: not-allowed; }
    button { padding: 8px 15px; margin-top: 10px; cursor: pointer; border: none; font-weight: bold; border-radius: 4px; }
    #saveEditBtn { background: #00796b; color: white; }
    #saveEditBtn:hover { background: #004d40; }
    #addGroupBtn { background: #1976d2; color: white; margin-left: 10px; }
    #addGroupBtn:hover { background: #0d47a1; }
    .actions { display: flex; justify-content: flex-end; margin-bottom: 15px;}
    .delete-row { background: #d32f2f; color: white; border: none; padding: 3px 6px; cursor: pointer; border-radius: 3px; font-size: 10px;}
  </style>
</head>
<body>
  <h3 id="editTitle">Редагування групи: </h3>

  <div class="actions">
    <button id="saveEditBtn">💾 Зберегти зміни</button>
  </div>
  
  <table>
    <thead>
      <tr>
        <th style="width: 20%;">Логін (у Meet)</th>
        <th style="width: 25%;">ФІО (Для звітності)</th>
        <th style="width: 25%;">Підгрупа</th>
        <th style="width: 20%;">Примітка</th>
        <th style="width: 10%;">Дія</th>
      </tr>
    </thead>
    <tbody id="groupTableBody">

    </tbody>
  </table>

  <script src="edit.js"></script>
</body>
</html>
